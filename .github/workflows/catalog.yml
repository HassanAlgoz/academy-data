name: Validate dataset catalog
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/build_catalog.py
      - run: git diff --exit-code -- catalog.json academy/_registry.py
      - run: PYTHONPATH=. python scripts/test_academy.py
